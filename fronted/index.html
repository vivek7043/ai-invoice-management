<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <title>AI Invoice Management</title>
    <!-- Inline critical styles to avoid FOUC before Tailwind CSS loads -->
    <style>
      html,body,#root{height:100%}
      body{background-color:#F8FAFC;color:#0f172a;font-family:Inter, ui-sans-serif, system-ui, -apple-system,'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;margin:0;-webkit-font-smoothing:antialiased}
      .card{background:#f0f9ff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04);border:1px solid #eef2ff;padding:1rem}
      .app-container{min-height:100vh;display:flex}
    </style>
    <!-- Set theme class early to prevent theme flicker (Default to Dark Mode) -->
    <script>
      (function(){
        try{
          var t = localStorage.getItem('theme')
          if (t !== 'light') {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        }catch(e){}
      })()
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
